name: Temporary Whisper Model Package

on:
  push:
    branches:
      - temp-whisper-model-20260729

permissions:
  contents: read

jobs:
  package-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download Whisper model
        run: |
          curl -L --fail --retry 5 --retry-delay 3 \
            -o ggml-small.en-q5_1.bin \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.en-q5_1.bin?download=true'
          test -s ggml-small.en-q5_1.bin
          sha256sum ggml-small.en-q5_1.bin
          ls -lh ggml-small.en-q5_1.bin

      - name: Package model as ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-small-en-q5_1-model
          path: ggml-small.en-q5_1.bin
          retention-days: 1
          compression-level: 0
